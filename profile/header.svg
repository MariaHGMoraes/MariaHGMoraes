<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Maria — Design, Web e Dados</title>
  <desc id="desc">Banner pessoal com identidade visual lilás, elementos de design e programação.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171326"/>
      <stop offset="48%" stop-color="#29204A"/>
      <stop offset="100%" stop-color="#4C2A70"/>
    </linearGradient>

    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D4AFF" stop-opacity=".18"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity=".18"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F9A8D4"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#C4B5FD" stroke-width="1" opacity=".10"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="320" rx="22" fill="url(#grid)"/>

  <!-- Decorative glows -->
  <circle cx="90" cy="55" r="105" fill="#8B5CF6" opacity=".28" filter="url(#softGlow)"/>
  <circle cx="1100" cy="65" r="115" fill="#F472B6" opacity=".22" filter="url(#softGlow)"/>
  <circle cx="1025" cy="285" r="100" fill="#A78BFA" opacity=".14" filter="url(#softGlow)"/>

  <!-- Soft organic shapes -->
  <circle cx="72" cy="62" r="76" fill="#8B5CF6" opacity=".25"/>
  <circle cx="1110" cy="58" r="92" fill="#F9A8D4" opacity=".22"/>

  <!-- Bottom waves -->
  <path d="M0 245 C150 205 250 285 410 244 C560 206 650 220 790 245 C945 274 1050 214 1200 240 L1200 320 L0 320 Z"
        fill="url(#wave)"/>
  <path d="M0 275 C160 235 270 300 430 270 C585 241 700 252 840 276 C985 300 1080 255 1200 270 L1200 320 L0 320 Z"
        fill="#0F0B1C" opacity=".30"/>

  <!-- Left code symbol -->
  <g fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 83 L205 133 L255 183"/>
    <path d="M315 83 L365 133 L315 183"/>
    <path d="M295 72 L275 194"/>
  </g>

  <!-- Small sparkle -->
  <path d="M145 48 L151 63 L166 69 L151 75 L145 90 L139 75 L124 69 L139 63 Z"
        fill="#F9A8D4"/>

  <!-- Editorial line -->
  <path d="M62 215 C125 180 170 235 230 205 C250 195 265 188 286 190"
        fill="none" stroke="#C4B5FD" stroke-width="2" opacity=".8"/>
  <circle cx="62" cy="215" r="4" fill="#F9A8D4"/>
  <circle cx="286" cy="190" r="4" fill="#A78BFA"/>

  <!-- Main typography -->
  <text x="600" y="137"
        text-anchor="middle"
        font-family="Georgia, sans-serif"
        font-size="76"
        font-weight="700"
        letter-spacing="-1.5"
        fill="#FFFFFF">Maria</text>

  <text x="600" y="176"
        text-anchor="middle"
        font-family="Georgia, sans-serif"
        font-size="19"
        font-weight="500"
        letter-spacing="4"
        fill="#E9D5FF">Design · Web · Dados</text>

  <!-- Divider -->
  <g stroke="url(#accent)" stroke-width="2">
    <path d="M420 208 H555"/>
    <path d="M645 208 H780"/>
  </g>
  <path d="M600 198 L610 208 L600 218 L590 208 Z" fill="#F9A8D4"/>

  <!-- Terminal window -->
  <g transform="translate(875 72)">
    <rect x="0" y="0" width="245" height="142" rx="16" fill="#11101C" stroke="#A78BFA" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="34" rx="16" fill="#19172A"/>
    <circle cx="20" cy="17" r="5" fill="#FB7185"/>
    <circle cx="39" cy="17" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="17" r="5" fill="#34D399"/>

    <g stroke-linecap="round">
      <path d="M22 57 H83" stroke="#C4B5FD" stroke-width="4"/>
      <path d="M22 82 H135" stroke="#A78BFA" stroke-width="4"/>
      <path d="M22 107 H103" stroke="#F9A8D4" stroke-width="4"/>
      <path d="M22 129 H160" stroke="#C4B5FD" stroke-width="4"/>
    </g>
  </g>

  <!-- Cursor -->
  <path d="M838 205 L870 217 L858 224 L870 239 L861 245 L849 229 L838 237 Z"
        fill="#F9A8D4"/>

  <!-- Botanical accent -->
  <g fill="none" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round">
    <path d="M1082 246 C1090 220 1105 201 1124 181"/>
    <path d="M1097 218 C1082 211 1076 200 1080 190 C1091 192 1099 202 1097 218 Z"/>
    <path d="M1108 202 C1110 187 1119 178 1130 176 C1132 187 1124 198 1108 202 Z"/>
    <path d="M1090 232 C1077 229 1069 220 1069 211 C1081 211 1089 219 1090 232 Z"/>
  </g>

  <!-- Sparkles -->
  <path d="M1015 225 L1021 239 L1035 245 L1021 251 L1015 265 L1009 251 L995 245 L1009 239 Z"
        fill="#C4B5FD"/>
  <path d="M790 54 L795 65 L806 70 L795 75 L790 86 L785 75 L774 70 L785 65 Z"
        fill="#F9A8D4"/>
</svg>
